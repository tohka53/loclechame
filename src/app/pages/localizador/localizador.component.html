<app-navbar></app-navbar>

<!-- MODAL: Código del Transportista -->
<div class="modal-backdrop" 
     *ngIf="showTransportistaModal" 
     (click)="cerrarModalSiClickFuera($event)">
  <div class="modal" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="cerrarModalTransportista()" aria-label="Cerrar">
      ×
    </button>
    <h2>Transportista</h2>
    <p>Ingresa el código del transportista para cargar predios y unidades.</p>

   <form [formGroup]="transportistaForm" (ngSubmit)="confirmarTransportista()">
  <label>Código de transportista</label>
  <input 
    formControlName="codigo" 
    placeholder="Ej. 202620" 
    readonly 
    style="background-color: #f5f5f5; cursor: not-allowed;" />
  <small style="color: #666; display: block; margin-top: 8px;">
    Este es tu código de usuario asignado
  </small>
  <div class="modal-actions">
    <button type="button" class="btn primary" (click)="cerrarModalTransportista()">
      Continuar
    </button>
  </div>
</form>
  </div>
</div>

<div class="wrap">
  <h2>Localizador de trayecto</h2>

  <form [formGroup]="form" (ngSubmit)="guardarPuntoDirecto()">

    <div class="card" *ngIf="codTransportista" style="margin-bottom:12px">
      <div class="card-header-line">
        <!-- IZQUIERDA: Transportista + resumen de unidad/predio/conductor -->
        <div class="card-header-info">
          <small>
            Transportista: <b>{{ codTransportista }}</b>
          </small>
          <!-- Resumen de la sesión actual del localizador -->
        <!--   <span *ngIf="localInfo" class="local-pill">
            Unidad: <b>{{ localInfo.placa_cabezal }}</b>
            • Predio: <b>{{ localInfo.id_predio }}</b>
            <span *ngIf="localInfo.nombre_piloto">
              • Conductor: <b>{{ localInfo.nombre_piloto }}</b>
            </span>
          </span> -->
        </div>
        <!-- DERECHA: Botones -->
        <div class="card-header-actions">
        <!--   <button
            class="btn small"
            type="button"
            (click)="abrirModalTransportista()"
          >
            Cambiar transportista
          </button> -->
          <!-- Opcional: para cambiar unidad/predio -->
          <button
            class="btn small ghost"
            type="button"
            *ngIf="localInfo"
            (click)="limpiarLocalInfo()"
          >
            Cambiar unidad/predio
          </button>
        </div>
      </div>
    </div>

    <!-- PLACA / UNIDAD - AUTOCOMPLETE -->
    <label>Placa / Unidad</label>
    <div class="autocomplete">
      <input
        type="text"
        [formControl]="placaSearchCtrl"
        placeholder="Busca por placa o tipo..."
        autocomplete="off"
        (focus)="onPlacaFocus()"
        (blur)="onPlacaBlur()"
      />
      <!-- Lista de resultados -->
      <ul
        class="autocomplete-list"
        *ngIf="showPlacaDropdown && filteredUnidades.length"
      >
        <li
          class="autocomplete-item"
          *ngFor="let u of filteredUnidades"
          (mousedown)="selectUnidad(u)"
        >
          <strong>{{ u.codigo }}</strong> • {{ u.tipo }}
        </li>
      </ul>
      <!-- Control real que viaja en el form -->
      <input type="hidden" formControlName="placa_cabezal" />
    </div>

    <!-- PREDIO - AUTOCOMPLETE -->
    <label>Predio</label>
    <div class="autocomplete">
      <input
        type="text"
        [formControl]="predioSearchCtrl"
        placeholder="Busca por nombre o código..."
        autocomplete="off"
        (focus)="onPredioFocus()"
        (blur)="onPredioBlur()"
      />
      <ul
        class="autocomplete-list"
        *ngIf="showPredioDropdown && filteredPredios.length"
      >
        <li
          class="autocomplete-item"
          *ngFor="let p of filteredPredios"
          (mousedown)="selectPredio(p)"
        >
          <strong>{{ p.codigo }}</strong> • {{ p.nombre }}
        </li>
      </ul>
      <input type="hidden" formControlName="id_predio" />
    </div>

    <label>Conductor (Nombre staff)</label>
    <input formControlName="nombre_piloto" readonly placeholder="Se completa al elegir la unidad" />

    <!-- ESTADO DE RUTA - Radio buttons modernos en 2 columnas -->
    <div class="estado-section">
      <h4 class="estado-title">Estado del trayecto</h4>
      
      <div class="radio-grid">
        <label class="radio-card">
          <input type="radio" formControlName="estado" value="INICIO_RUTA" />
          <div class="radio-content">
            <span class="radio-label">Inicio de ruta</span>
          </div>
          <div class="radio-indicator"></div>
        </label>

        <label class="radio-card">
          <input type="radio" formControlName="estado" value="DESCANSO_RUTA" />
          <div class="radio-content">
            <span class="radio-label">Descanso en ruta</span>
          </div>
          <div class="radio-indicator"></div>
        </label>

        <label class="radio-card">
          <input type="radio" formControlName="estado" value="DESPERFECTO_RUTA" />
          <div class="radio-content">
            <span class="radio-label">Desperfecto en ruta</span>
          </div>
          <div class="radio-indicator"></div>
        </label>

        <label class="radio-card">
          <input type="radio" formControlName="estado" value="FIN_TRAYECTO" />
          <div class="radio-content">
            <span class="radio-label">Fin de trayecto</span>
          </div>
          <div class="radio-indicator"></div>
        </label>
      </div>
    </div>

    <label>Notas (opcional)</label>
    <textarea formControlName="notas" rows="3" placeholder="Observaciones..."></textarea>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Guardando...' : 'Guardar punto' }}
    </button>
  </form>
</div>
