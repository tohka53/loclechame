<div class="login-card">
  <h2>Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Usuario</label>
    <input formControlName="id_usuario" placeholder="correo/uid/etc" />

    <!-- La casilla JWT permanece SIEMPRE en el mismo lugar y no se mueve -->
    <label>Token JWT (auto)</label>
    <input formControlName="token_jwt" placeholder="se generará automáticamente" readonly />

    <button [disabled]="loading || form.get('id_usuario')?.invalid">
      {{ loading ? 'Ingresando…' : 'Entrar' }}
    </button>

    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>
