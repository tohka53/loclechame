<div class="login-card">
  <h2>Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Usuario</label>
    <input formControlName="id_usuario" placeholder="correo/uid/etc" />

    <label>Contraseña</label>
    <input formControlName="contra" type="password" placeholder="••••••" />

    
    <input type="hidden" formControlName="token_jwt" />

    <button 
      type="submit" 
      [disabled]="loading || form.invalid">
      {{ loading ? 'Ingresando…' : 'Entrar' }}
    </button>

    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>
